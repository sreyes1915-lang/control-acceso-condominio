<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control de Acceso · Guarda</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,system-ui,sans-serif;background:#f4f7fb;color:#172033;min-height:100vh}header{padding:18px 22px;background:#fff;border-bottom:1px solid #dfe5ee;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:12px;align-items:center}.logo{width:42px;height:42px;border-radius:12px;background:#2563eb;display:grid;place-items:center;color:#fff;font-weight:800}.muted{color:#667085;font-size:14px}main{max-width:650px;margin:auto;padding:22px}.card{background:#fff;border:1px solid #dfe5ee;border-radius:18px;padding:22px}.primary{background:#2563eb;color:#fff;border:0;border-radius:12px;padding:14px 18px;font-weight:800;cursor:pointer;width:100%}.secondary{background:#fff;color:#172033;border:1px solid #dfe5ee;border-radius:12px;padding:13px 18px;font-weight:800;cursor:pointer;width:100%}input{width:100%;padding:15px;border:1px solid #dfe5ee;border-radius:12px;font-size:18px;text-align:center;text-transform:uppercase;letter-spacing:3px;margin:8px 0 10px}video{width:100%;border-radius:16px;background:#000;margin-top:15px;min-height:280px}.hidden{display:none!important}.result{margin-top:18px;padding:25px;border-radius:16px;text-align:center}.good{background:#ecfdf3;border:3px solid #22c55e;color:#14532d}.bad{background:#fef2f2;border:3px solid #ef4444;color:#7f1d1d}.result .big{font-size:25px;font-weight:900}.person{font-size:22px;font-weight:800;margin-top:10px}.login{position:fixed;inset:0;background:#0b1220;display:grid;place-items:center;padding:20px;z-index:10}.loginbox{width:min(420px,100%);background:#121b2b;color:#fff;border-radius:18px;padding:28px}.loginbox input{text-align:left;letter-spacing:0;background:#fff;color:#172033}.logout{font-size:12px;padding:8px 10px;border:1px solid #dfe5ee;background:#fff;border-radius:9px;cursor:pointer}@media(max-width:600px){main{padding:14px}header{padding:14px}}
</style>
</head>
<body>
<header><div class="brand"><div class="logo">QR</div><div><b>Control de Acceso</b><div class="muted">Panel del guarda</div></div></div><button class="logout" id="logout">Salir</button></header>
<main>
<div class="card">
<h2 style="text-align:center">🛡️ Validar acceso</h2>
<p class="muted" style="text-align:center;margin-top:7px">Escanee el QR del visitante o use su código de respaldo.</p>
<button class="primary" style="margin-top:20px" id="scanBtn">📷 Escanear QR</button>
<video id="video" class="hidden" autoplay playsinline></video>
<div style="text-align:center;margin:22px 0 10px" class="muted">— o —</div>
<input id="manual" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="5831" autocomplete="off">
<button class="secondary" id="manualBtn">Validar código</button>
<div id="result"></div>
</div>
</main>
<div id="login" class="login"><div class="loginbox"><h2>🔐 Acceso de guarda</h2><p style="color:#a9b5c8;margin-top:8px">Ingrese con la cuenta autorizada para guardas.</p><label style="display:block;margin-top:20px">Correo</label><input id="email" type="email" placeholder="guarda@condominio.com"><label style="display:block;margin-top:12px">Contraseña</label><input id="password" type="password" placeholder="Contraseña"><button class="primary" id="loginBtn" style="margin-top:16px">Entrar</button><div id="loginMsg" style="color:#fca5a5;margin-top:12px"></div></div></div>
<script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2';
const client=createClient('https://dbnjciqldjoospgmvlbq.supabase.co','sb_publishable_IipOpR7MYXbCpNVOqSpGhw_BZZJV7fo');
const $=id=>document.getElementById(id);
function backupCode(token){const clean=String(token||'').replace(/-/g,'').toLowerCase();let hash=2166136261;for(const ch of clean){hash^=ch.charCodeAt(0);hash=Math.imul(hash,16777619)}return String((hash>>>0)%10000).padStart(4,'0')}
async function validate(value,isBackup=false){const input=String(value||'').trim();if(!input)return;let p=null;if(isBackup){const {data,error}=await client.from('authorized_people').select('id,name,type,status,qr_token,units(name)');if(!error)p=(data||[]).find(x=>backupCode(x.qr_token)===input.replace(/\D/g,'').slice(0,4))}else{const {data}=await client.from('authorized_people').select('id,name,type,status,qr_token,units(name)').eq('qr_token',input).maybeSingle();if(data)p=data}if(p)p.unit=p.units?.name||'';const result=p&&p.status==='Activo'?'AUTORIZADO':'DENEGADO';await client.from('access_logs').insert({person_id:p?.id||null,qr_token:p?.qr_token||null,result,guard_name:'Guarda'});if(!p){$('result').innerHTML='<div class="result bad"><div class="big">✕ NO AUTORIZADO</div><div style="margin-top:8px">Código no encontrado.</div></div>';return}if(p.status!=='Activo'){$('result').innerHTML=`<div class="result bad"><div class="big">✕ ACCESO DENEGADO</div><div class="person">${p.name}</div><div>${p.unit} · ${p.type}</div><div style="margin-top:8px">La autorización está inactiva.</div></div>`;return}$('result').innerHTML=`<div class="result good"><div class="big">✓ ACCESO AUTORIZADO</div><div class="person">${p.name}</div><div>${p.unit} · ${p.type}</div><div style="margin-top:8px">${new Date().toLocaleString()}</div></div>`}
$('manualBtn').onclick=()=>validate($('manual').value,true);$('manual').onkeydown=e=>{if(e.key==='Enter')validate($('manual').value,true)};
$('scanBtn').onclick=async()=>{const video=$('video');video.classList.remove('hidden');try{const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});video.srcObject=stream;const m=await import('https://esm.sh/jsqr@1.4.0');const jsQR=m.default||m;const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});const loop=async()=>{if(video.readyState>=2){canvas.width=video.videoWidth;canvas.height=video.videoHeight;ctx.drawImage(video,0,0,canvas.width,canvas.height);const image=ctx.getImageData(0,0,canvas.width,canvas.height);const code=jsQR(image.data,image.width,image.height);if(code?.data){await validate(code.data,false);stream.getTracks().forEach(t=>t.stop());video.classList.add('hidden');return}}requestAnimationFrame(loop)};loop()}catch(e){video.classList.add('hidden');alert('No se pudo acceder a la cámara. Use el código de respaldo.')}};
$('loginBtn').onclick=async()=>{const msg=$('loginMsg');msg.textContent='Conectando...';const {error}=await client.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){msg.textContent='Correo o contraseña incorrectos.';return}$('login').classList.add('hidden')};$('password').onkeydown=e=>{if(e.key==='Enter')$('loginBtn').click()};$('logout').onclick=async()=>{await client.auth.signOut();location.reload()};const {data:{session}}=await client.auth.getSession();if(session)$('login').classList.add('hidden');
</script>
</body>
</html>
